<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL学習環境 - INNER JOIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* スクロールバーのスタイリング */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm border-b border-gray-200 p-4 flex justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-xl font-bold text-blue-700">SQL学習環境 <span class="text-sm font-normal text-gray-500 ml-2">〜複数テーブルの結合 (INNER JOIN)〜</span></h1>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- サイドバー (データベース構造) -->
        <aside class="w-1/3 min-w-[300px] max-w-sm bg-gray-50 border-r border-gray-200 flex flex-col overflow-y-auto">
            
            <div class="p-4 flex-1">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">データベース構造</h2>
                    <button onclick="reInitDB()" class="text-xs text-blue-600 hover:text-blue-800 underline">DBを初期状態に戻す</button>
                </div>
                <div id="schema-container" class="space-y-4">
                    <div class="text-sm text-gray-500">データベースを読み込み中...</div>
                </div>
            </div>
        </aside>

        <!-- メインコンテンツ (SQL入力 & 結果) -->
        <section class="flex-1 flex flex-col min-w-0 bg-white">
            
            <!-- SQL入力エリア -->
            <div class="p-4 flex flex-col h-1/2 border-b border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">SQL入力</h2>
                    <div class="space-x-2">
                        <button onclick="clearEditor()" class="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded transition">入力を消す</button>
                        <button onclick="runUserSQL()" class="px-5 py-1 text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded shadow transition flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            実行
                        </button>
                    </div>
                </div>
                <textarea id="sql-editor" class="flex-1 w-full p-3 bg-gray-50 border border-gray-300 rounded font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none transition" placeholder="ここにSQLを入力してください...&#10;例: SELECT * FROM 生徒;"></textarea>
            </div>

            <!-- 実行結果エリア -->
            <div class="flex-1 p-4 flex flex-col min-h-0 bg-gray-50">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2 shrink-0">実行結果</h2>
                
                <!-- メッセージ表示用 -->
                <div id="result-message" class="hidden mb-2 p-2 text-sm rounded shrink-0"></div>
                
                <!-- テーブル表示用 -->
                <div class="flex-1 overflow-auto bg-white border border-gray-300 rounded shadow-sm relative">
                    <table id="result-table" class="min-w-full text-left text-sm whitespace-nowrap">
                        <thead id="result-thead" class="bg-gray-100 border-b border-gray-300 sticky top-0">
                            <!-- ヘッダー -->
                        </thead>
                        <tbody id="result-tbody" class="divide-y divide-gray-200">
                            <!-- データ行 -->
                        </tbody>
                    </table>
                    <div id="result-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm">
                        SQLを実行するとここに結果が表示されます。
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let db = null;
        const LS_KEY = 'sql_learning_simple_state_join';
        
        // 学習状態（localStorageに保存するデータ）
        let appState = {
            sqlInput: ""
        };

        window.onload = async function() {
            try {
                // 1. 状態の復元
                loadState();
                
                // UI反映
                const editor = document.getElementById('sql-editor');
                editor.value = appState.sqlInput;
                
                // 入力イベントで自動保存
                editor.addEventListener('input', () => {
                    appState.sqlInput = editor.value;
                    autoSave();
                });

                // 2. sql.jsの初期化
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                
                // 3. データベースの構築
                setupDatabase(SQL);

            } catch (error) {
                console.error("初期化エラー:", error);
            }
        };

        function setupDatabase(SQL) {
            db = new SQL.Database();

            // 生徒テーブル作成
            db.run(`
                CREATE TABLE 生徒 (
                    生徒ID TEXT PRIMARY KEY,
                    氏名 TEXT,
                    クラス TEXT
                );
            `);

            // 貸出テーブル作成
            db.run(`
                CREATE TABLE 貸出 (
                    貸出ID INTEGER PRIMARY KEY,
                    生徒ID TEXT,
                    書籍名 TEXT,
                    貸出日 TEXT,
                    FOREIGN KEY (生徒ID) REFERENCES 生徒(生徒ID)
                );
            `);

            // データ投入
            const insertStudents = `
                INSERT INTO 生徒 (生徒ID, 氏名, クラス) VALUES 
                ('001', '佐藤 花子', '1A'),
                ('002', '鈴木 太郎', '1B'),
                ('003', '高橋 美咲', '1A'),
                ('004', '田中 翔', '1C'),
                ('005', '伊藤 蓮', '1B'),
                ('006', '渡辺 結衣', '1A'),
                ('007', '山本 悠斗', '1C'),
                ('008', '中村 葵', '1B');
            `;
            
            const insertRentals = `
                INSERT INTO 貸出 (貸出ID, 生徒ID, 書籍名, 貸出日) VALUES 
                (1, '001', '情報入門', '2026-09-10'),
                (2, '003', 'Python基礎', '2026-09-12'),
                (3, '001', 'データ分析', '2026-09-15'),
                (4, '002', 'ネットワークの基礎', '2026-09-18'),
                (5, '006', 'アルゴリズム入門', '2026-09-20'),
                (6, '003', 'AIのしくみ', '2026-09-22'),
                (7, '005', 'プレゼンの技術', '2026-09-24'),
                (8, '001', '情報モラル', '2026-09-25'),
                (9, '007', 'データベース入門', '2026-09-27'),
                (10, '006', 'Webデザイン', '2026-09-28');
            `;

            db.run(insertStudents);
            db.run(insertRentals);

            renderSchema();
        }

        function renderSchema() {
            const container = document.getElementById('schema-container');
            container.innerHTML = '';

            // テーブル一覧取得
            const tablesResult = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';");
            if (tablesResult.length === 0) return;

            const tables = tablesResult[0].values.map(row => row[0]);

            tables.forEach(tableName => {
                // カラム情報取得
                const columnsResult = db.exec(`PRAGMA table_info('${tableName}');`);
                // 外部キー情報取得
                const fkResult = db.exec(`PRAGMA foreign_key_list('${tableName}');`);
                
                let fkMap = {};
                if (fkResult.length > 0) {
                    fkResult[0].values.forEach(fk => {
                        // fk[3]が自テーブルのカラム名, fk[2]が参照先テーブル, fk[4]が参照先カラム名
                        fkMap[fk[3]] = { refTable: fk[2], refCol: fk[4] };
                    });
                }

                // UI要素生成
                const tableDiv = document.createElement('div');
                tableDiv.className = 'border border-gray-200 rounded overflow-hidden bg-white shadow-sm';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'bg-gray-100 p-2 cursor-pointer flex justify-between items-center select-none hover:bg-gray-200 transition';
                headerDiv.onclick = () => toggleTableCollapse(tableName + '-cols');
                headerDiv.innerHTML = `<span class="font-bold text-sm text-gray-700">▼ ${tableName}</span>`;
                
                const colsDiv = document.createElement('div');
                colsDiv.id = tableName + '-cols';
                colsDiv.className = 'p-2 space-y-1';

                columnsResult[0].values.forEach(col => {
                    // col[1]: name, col[2]: type, col[5]: pk
                    const colName = col[1];
                    const colType = col[2];
                    const isPk = col[5] === 1;
                    const fkInfo = fkMap[colName];

                    let icon = '<span class="inline-block w-5 text-center text-gray-300 ml-1"></span>';
                    if (isPk) icon = '<span class="inline-block w-5 text-center text-yellow-500 text-sm ml-1" title="主キー">🔑</span>';
                    if (fkInfo) icon = '<span class="inline-block w-5 text-center text-blue-500 text-sm ml-1" title="外部キー">🔗</span>';

                    const colWrapper = document.createElement('div');
                    colWrapper.className = 'text-sm font-mono flex flex-col';
                    
                    const mainLine = document.createElement('div');
                    mainLine.className = 'flex items-center';
                    mainLine.innerHTML = `${icon} <span class="text-gray-800 ml-1 font-semibold w-24">${colName}</span> <span class="text-gray-500 text-xs">${colType}</span>`;
                    colWrapper.appendChild(mainLine);

                    if (fkInfo) {
                        const fkLine = document.createElement('div');
                        fkLine.className = 'text-xs text-gray-500 ml-8 mt-0.5 bg-blue-50 px-1 py-0.5 rounded inline-block w-max';
                        fkLine.innerText = `→ ${fkInfo.refTable}.${fkInfo.refCol} を参照`;
                        colWrapper.appendChild(fkLine);
                    }

                    colsDiv.appendChild(colWrapper);
                });

                tableDiv.appendChild(headerDiv);
                tableDiv.appendChild(colsDiv);
                container.appendChild(tableDiv);
            });
        }

        function toggleTableCollapse(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.previousElementSibling.innerHTML = el.previousElementSibling.innerHTML.replace('▶', '▼');
            } else {
                el.classList.add('hidden');
                el.previousElementSibling.innerHTML = el.previousElementSibling.innerHTML.replace('▼', '▶');
            }
        }

        function runUserSQL() {
            const editor = document.getElementById('sql-editor');
            const sql = editor.value.trim();
            const msgEl = document.getElementById('result-message');
            const tHead = document.getElementById('result-thead');
            const tBody = document.getElementById('result-tbody');
            const placeholder = document.getElementById('result-placeholder');

            // UIリセット
            msgEl.classList.add('hidden');
            tHead.innerHTML = '';
            tBody.innerHTML = '';
            placeholder.classList.add('hidden');

            if (!sql) {
                placeholder.classList.remove('hidden');
                return;
            }

            try {
                // 実行
                const result = db.exec(sql);
                
                // 状態更新
                appState.sqlInput = sql;
                autoSave();

                if (result.length === 0) {
                    msgEl.textContent = "実行完了（結果データはありません）";
                    msgEl.className = "mb-2 p-2 text-sm rounded shrink-0 bg-green-50 text-green-700 border border-green-200";
                    msgEl.classList.remove('hidden');
                    return;
                }

                const columns = result[0].columns;
                const values = result[0].values;

                // ヘッダー生成
                const trHead = document.createElement('tr');
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.className = 'px-4 py-2 font-bold text-gray-700 border-r border-gray-200 last:border-r-0';
                    th.textContent = col;
                    trHead.appendChild(th);
                });
                tHead.appendChild(trHead);

                // データ行生成
                values.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'bg-white hover:bg-blue-50 transition' : 'bg-gray-50 hover:bg-blue-50 transition';
                    row.forEach(val => {
                        const td = document.createElement('td');
                        td.className = 'px-4 py-2 text-gray-800 border-r border-gray-200 last:border-r-0';
                        td.textContent = val === null ? 'NULL' : val;
                        tr.appendChild(td);
                    });
                    tBody.appendChild(tr);
                });

                msgEl.textContent = `実行成功: ${values.length} 件の結果`;
                msgEl.className = "mb-2 p-2 text-sm rounded shrink-0 bg-green-50 text-green-700 border border-green-200";
                msgEl.classList.remove('hidden');

            } catch (err) {
                // エラー表示 (SQLiteのエラーをそのまま表示)
                msgEl.textContent = "エラー: " + err.message;
                msgEl.className = "mb-2 p-3 text-sm rounded shrink-0 bg-red-50 text-red-700 border border-red-200 font-mono font-bold";
                msgEl.classList.remove('hidden');
            }
        }

        function clearEditor() {
            document.getElementById('sql-editor').value = '';
            appState.sqlInput = '';
            autoSave();
            document.getElementById('sql-editor').focus();
        }

        function autoSave() {
            try {
                localStorage.setItem(LS_KEY, JSON.stringify(appState));
            } catch (e) {
                console.error("保存失敗:", e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(LS_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState.sqlInput = parsed.sqlInput || "";
                }
            } catch (e) {
                console.error("状態の復元に失敗しました", e);
                localStorage.removeItem(LS_KEY);
            }
        }

        function reInitDB() {
            // DBのみ再構築
            const SQL = db.export();
            db.close();
            
            const sqlJsObj = window.SQL;
            db = new sqlJsObj.Database();
            setupDatabase(db);
            
            // 結果エリアをクリアして通知
            const msgEl = document.getElementById('result-message');
            msgEl.textContent = "データベースを初期状態に戻しました。";
            msgEl.className = "mb-2 p-2 text-sm rounded shrink-0 bg-blue-50 text-blue-700 border border-blue-200";
            msgEl.classList.remove('hidden');

            document.getElementById('result-thead').innerHTML = '';
            document.getElementById('result-tbody').innerHTML = '';
            document.getElementById('result-placeholder').classList.remove('hidden');
        }

    </script>
</body>
</html>
